<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Headline numbers"><rect x="24" y="24" width="226" height="102" rx="10" fill="#fff" stroke="#E3DACC"/><rect x="24" y="24" width="6" height="102" rx="3" fill="#6B8F3A"/><text x="46" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#141413">0 of 288</text><text x="46" y="88" font-size="12" fill="#5E5D59">cells with an overflow when</text><text x="46" y="104" font-size="12" fill="#5E5D59">the guard sits at the plant</text><rect x="266" y="24" width="226" height="102" rx="10" fill="#fff" stroke="#E3DACC"/><rect x="266" y="24" width="6" height="102" rx="3" fill="#C6613F"/><text x="288" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#141413">1x hold</text><text x="288" y="88" font-size="12" fill="#5E5D59">delay a remote guard</text><text x="288" y="104" font-size="12" fill="#5E5D59">tolerates, about one hold</text><text x="288" y="120" font-size="12" fill="#5E5D59">period</text><rect x="508" y="24" width="226" height="102" rx="10" fill="#fff" stroke="#E3DACC"/><rect x="508" y="24" width="6" height="102" rx="3" fill="#4F86C6"/><text x="530" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#141413">3 of 3</text><text x="530" y="88" font-size="12" fill="#5E5D59">covert attacks that beat</text><text x="530" y="104" font-size="12" fill="#5E5D59">block-and-hold at a 1%</text><text x="530" y="120" font-size="12" fill="#5E5D59">false-alarm budget</text><rect x="750" y="24" width="226" height="102" rx="10" fill="#fff" stroke="#E3DACC"/><rect x="750" y="24" width="6" height="102" rx="3" fill="#141413"/><text x="772" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#141413">190</text><text x="772" y="88" font-size="12" fill="#5E5D59">tests passing, ruff and</text><text x="772" y="104" font-size="12" fill="#5E5D59">mypy strict clean</text></svg>