[project]
name = "quadtank-control"
version = "0.1.0"
description = "AI-control red-team evaluation on a simulated quadruple-tank process"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "control>=0.10",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quadtank_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
